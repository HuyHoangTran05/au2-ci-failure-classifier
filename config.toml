# Cấu hình dự án AU2 - phân loại lỗi CI.
# Nhãn dùng khi gán tay. "unknown" không nằm ở đây: đó là giá trị bộ phân loại trả về khi không chắc (abstain).
# "other" không có trong đề bài, nhưng cần để gán nhãn trung thực cho lint, build tài liệu, kiểm tra chính sách...
categories = [
    "compilation",
    "test_assertion",
    "dependency",
    "authentication",
    "infrastructure",
    "other",
]

[runbooks]
# Loại lỗi -> runbook. Khi có quyền truy cập, thay bằng link runbook thật trong DMS_DOCS.
compilation = "docs/runbooks/compilation.md"
test_assertion = "docs/runbooks/test_assertion.md"
dependency = "docs/runbooks/dependency.md"
authentication = "docs/runbooks/authentication.md"
infrastructure = "docs/runbooks/infrastructure.md"
other = "docs/runbooks/other.md"
unknown = "docs/runbooks/unknown.md"

[fetch]
# Repo công khai dùng GitHub Actions, chọn nhiều ngôn ngữ để lỗi đa dạng.
repos = [
    "dotnet/aspire",
    "microsoft/semantic-kernel",
    "microsoft/vscode",
    "microsoft/TypeScript",
    "microsoft/playwright",
    "python/cpython",
    "home-assistant/core",
    "grafana/grafana",
]
runs_per_repo = 40      # số run fail tối đa lấy về mỗi repo
max_per_workflow = 6    # không để một workflow chiếm hết dữ liệu của repo
scan_limit = 300        # số run fail gần nhất được quét để chọn mẫu
timeout_seconds = 180   # thời gian chờ tối đa cho mỗi lệnh gh

[excerpt]
strategy = "marker"             # "marker": cửa sổ trước dấu lỗi; "hints": các cụm dòng có dấu hiệu lỗi
context_before_error = 40       # (marker) số dòng lấy trước mỗi dấu ##[error]
hint_budget = 40                # (hints) số dòng tối đa giữ lại mỗi job
hint_gap = 3                    # (hints) hai dòng lỗi cách nhau <= N dòng thì gộp thành một cụm
hint_padding = 3                # (hints) số dòng ngữ cảnh thêm trước/sau mỗi cụm
hint_key_weight = 3             # (hints) điểm cộng cho dòng khớp mẫu lỗi rõ ràng (KEY_LINE)
hint_recency_weight = 2         # (hints) điểm cộng cho cụm nằm gần cuối log
hint_anchor_lines = 5           # (hints) luôn giữ N dòng cuối trước dấu lỗi cuối cùng
tail_lines_without_marker = 40  # nếu job không có ##[error] thì lấy N dòng cuối
max_key_lines = 15              # số dòng "đáng chú ý" tối đa lấy từ toàn bộ job
max_lines_per_job = 120
max_total_lines = 300
max_line_chars = 400

# Profile cắt log thử nghiệm: CI_EXCERPT_PROFILE=<tên> dùng các giá trị ghi đè dưới đây, lưu đoạn cắt vào data/excerpts-<tên>/.
[excerpt.profiles.wide80]
context_before_error = 80       # cửa sổ rộng gấp đôi trước dấu lỗi

[excerpt.profiles.diff]
strategy = "baseline-diff"      # bỏ dòng cũng có trong run thành công gần nhất (cần fetch-baselines); job không có baseline dùng marker

[excerpt.profiles.hints]
strategy = "hints"              # thử nghiệm: kém hơn "marker" trên train (xem docs/reports)
hint_anchor_lines = 30

[split]
test_fraction = 0.3
seed = 42

[evaluation]
bootstrap_samples = 1000   # số lần lấy mẫu lại (theo nhóm repo/workflow) để tính khoảng tin cậy 95%

[tfidf]
# Xác suất cao nhất thấp hơn ngưỡng này thì trả về "unknown". Chọn bằng `tune-tfidf` (CV trên train, 15/09/2026):
# 0.2 cho accuracy cao nhất; ngưỡng cũ 0.4 khiến 84% mẫu train bị trả "unknown". Có 6 loại nên xác suất cao nhất luôn >= 1/6.
abstain_below = 0.2

[llm]
# OpenRouter, chỉ dùng model miễn phí (đuôi :free). API key đặt trong .env (OPENROUTER_API_KEY), không commit.
base_url = "https://openrouter.ai/api/v1/chat/completions"
model = "nvidia/nemotron-3-super-120b-a12b:free"   # gemma-4-31b:free bị giới hạn upstream khi thử (14/09/2026)
temperature = 0
max_tokens = 1024           # đủ chỗ cho model có bước suy luận trước khi trả JSON
timeout_seconds = 120
requests_per_minute = 15    # model miễn phí giới hạn khoảng 20 lượt/phút
max_retries = 3
max_excerpt_chars = 20000   # đoạn log dài hơn thì giữ phần cuối
abstain_below = 0.0         # độ tự tin (model tự khai) thấp hơn ngưỡng này thì coi là "unknown"; 0 = tắt

[panel]
# Hội đồng LLM gán lại các mẫu của lượt gán mù (panel-run / panel-report). Ba họ model khác nhau; không dùng Nemotron
# (đang là bộ phân loại được đánh giá) và không dùng Claude (đã gán nhãn nháp). Đã thử gọi được ngày 15/09/2026;
# gemma-4 và laguna bị giới hạn upstream (429), inkling chỉ cho dùng qua agentic harness (403).
models = [
    "nex-agi/nex-n2.5-pro:free",
    "cohere/north-mini-code:free",
    "dots-studio/dots-3-note-preview:free",
]
sample_count = 291          # cả tập test; 80 mẫu đầu vẫn là mẫu của lượt gán mù (cùng thứ tự), mẫu trùng đoạn lỗi LogChunks bị bỏ
max_consecutive_errors = 5  # panel-run dừng khi gọi lỗi liên tiếp (mất mạng); chạy lại lệnh để tiếp tục
max_tokens = 2048           # model có bước suy luận cần chỗ trước khi trả JSON
retry_max_tokens = 6144     # panel-run --retry-unparseable: 15/240 câu trả lời đầu hết 2048 token trước khi viết JSON
requests_per_minute = 15
